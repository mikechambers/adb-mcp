<!DOCTYPE html>
<html>

<head>
  <script src="main.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div>
    <sp-button id="btnStart">Connect</sp-button>
  </div>
  <p>&nbsp;</p>
  <div>
    <sp-checkbox id="chkConnectOnLaunch">Connect on Launch</sp-checkbox>
  </div>
  <p>&nbsp;</p>
  <div class="settings">
    <sp-label>Proxy URL:</sp-label>
    <sp-textfield id="txtProxyUrl" placeholder="http://localhost:3001" style="width: 100%;"></sp-textfield>
    <sp-button id="btnSaveSettings" variant="secondary" style="margin-top: 8px;">Save</sp-button>
  </div>
  <footer>
    <div>
      <div>Created by Mike Chambers</div>
      <div>https://github.com/mikechambers/adb-mcp</div>
    </div>
  </footer>
</body>

</html>
